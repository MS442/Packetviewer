# Project-wide Gradle settings.

# AndroidX package structure. This is REQUIRED because every dependency
# in this project (appcompat, material, fragment, viewpager2, cardview,
# recyclerview, constraintlayout) is an AndroidX artifact - without this
# flag, Gradle's :app:checkDebugAarMetadata task fails the build.
android.useAndroidX=true

# We only depend on AndroidX libraries directly (no legacy
# android.support.* libraries anywhere), so Jetifier's compatibility
# shimming is unnecessary and safely disabled for a faster build.
android.enableJetifier=false

# Speeds up Gradle daemon startup / build reuse.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
